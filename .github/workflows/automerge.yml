name: Dependabot Auto-merge

on:
  schedule:
    # First Wednesday after the monthly Monday Dependabot run.
    - cron: "43 9 3-9 * 3"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: run-action/automerge@c27e29b3f58bfdbbc9240fbf69d8ca1c56174f29 # v1.3.0
        with:
          cooldown-days: 3

